allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - "@arethetypeswrong/cli@0.18.3"
  - "@arethetypeswrong/core@0.18.3"
  - "@commitlint/cli@21.0.2"
  - "@commitlint/config-conventional@21.0.2"
  - "@commitlint/is-ignored@21.0.2"
  - "@commitlint/lint@21.0.2"
  - "@commitlint/load@21.0.2"
  - "@commitlint/message@21.0.2"
  - "@commitlint/parse@21.0.2"
  - "@commitlint/read@21.0.2"
  - "@commitlint/rules@21.0.2"
  - "@commitlint/top-level@21.0.2"
  - pg-connection-string@2.14.0
  - pg-protocol@1.15.0
  - pg@8.22.0
overrides:
  "@hono/node-server@<1.19.13": ^1.19.13
  # PgBridgeClient subclasses pg.Client and must be driven by the same pg copy
  # @prisma/adapter-pg uses. adapter-pg's range (^8.16.3) lets pnpm keep a second
  # pg next to the bridge's direct dep; force a single copy.
  pg: ^8.22.0
