allowBuilds:
  # embedded-postgres ships per-arch Postgres binaries whose postinstall
  # rehydrates the dylib version symlinks; approve it so `pnpm bench` against
  # native Postgres works after a plain install. See benchmark/pg-server.ts.
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/linux-x64": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - "@arethetypeswrong/cli@0.18.4"
  - "@arethetypeswrong/core@0.18.4"
  - "@commitlint/cli@21.1.0"
  - "@commitlint/config-conventional@21.1.0"
  - "@commitlint/is-ignored@21.1.0"
  - "@commitlint/lint@21.1.0"
  - "@commitlint/load@21.1.0"
  - "@commitlint/message@21.0.2"
  - "@commitlint/parse@21.1.0"
  - "@commitlint/read@21.1.0"
  - "@commitlint/rules@21.1.0"
  - "@commitlint/top-level@21.0.2"
  - pg-connection-string@2.14.0
  - pg-protocol@1.15.0
  - pg@8.22.0
  - knip@6.25.0
overrides:
  "@hono/node-server@<1.19.13": ^1.19.13
  # PgBridgeClient subclasses pg.Client and must be driven by the same pg copy
  # @prisma/adapter-pg uses. adapter-pg's range (^8.16.3) lets pnpm keep a second
  # pg next to the bridge's direct dep; force a single copy.
  pg: ^8.22.0
